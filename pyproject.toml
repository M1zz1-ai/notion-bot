[project]
name = "notion-bot"
version = "0.2.0"
description = "A Telegram bot that replans one person's day: it moves unfinished tasks instead of cloning them, shows the plan before it commits it, and refuses to call a broken planner a rest day."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "M1zz1-ai" }]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "packaging>=26.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "notion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's classic default set, pinned EXPLICITLY rather than left implicit. The
# monorepo this code is exported from leaves it implicit and is green only
# because its lock holds ruff at 0.15; 0.16 widened the defaults, and CI here
# resolves ruff fresh on every run. Naming the rules keeps a ruff release from
# turning a clean export red, and keeps this repo enforcing exactly what its
# source tree enforces — no more, so the export cannot go red on clean upstream.
select = ["E4", "E7", "E9", "F"]
